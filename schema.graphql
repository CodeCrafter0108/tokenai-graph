directive @entity on OBJECT
directive @derivedFrom(field: String!) on FIELD_DEFINITION

type Token @entity{
  id : ID!
  blockTimestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!

  tokenOwner: Bytes! # address
  address: Bytes! # address
  name: String! # string
  symbol: String! # string
  siteUrl: String! # string
  imageUrl: String! # string
  chatUrl: String! # string
  socialUrl: String! # string
  description: String! # string
  decimals: Int!

  pair: LiquidityPair
  price: BigDecimal!
  supply: BigInt!
  marketCap: BigDecimal!
}

type LiquidityPair @entity{
  id: ID!
  token0: Bytes!
  token1: Bytes!
  reserve0: BigInt!
  reserve1: BigInt!
  swaps: [Swap!]! @derivedFrom(field: "pair")
}

type Swap @entity(immutable: true){
  id: ID!
  pair: LiquidityPair!
  amount: BigInt!
  price: BigDecimal!
  fromAIToken: Boolean!
  user: Bytes!
  transactionHash: Bytes!
  blockTimestamp: BigInt!
}

type TokenCounter @entity {
  id: ID!
  totalCount: Int!
}