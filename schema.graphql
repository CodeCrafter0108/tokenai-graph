directive @entity on OBJECT
directive @derivedFrom(field: String!) on FIELD_DEFINITION

type Token @entity{
  id : ID!
  blockTimestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!

  tokenOwner: Bytes! # address
  address: Bytes! # address
  name: String! # string
  symbol: String! # string
  siteUrl: String! # string
  imageUrl: String! # string
  chatUrl: String! # string
  socialUrl: String! # string
  description: String! # string
  decimals: Int!

  pair: LiquidityPair
  price: BigDecimal!
  priceInNative: BigDecimal!
  supply: BigInt!
  marketCap: BigDecimal!

  buys: BigInt!
  sells: BigInt!
  buyVolumeUSD: BigDecimal!
  sellVolumeUSD: BigDecimal!
  sellers: [Bytes!]
  buyers: [Bytes!]

  liquidityPool: BigDecimal!

  token24hData: [Token24hData!]! @derivedFrom(field: "token")
  tokenPrice6h: [TokenPrice6h!]! @derivedFrom(field: "token")
  tokenPriceHour: [TokenPriceHour!]! @derivedFrom(field: "token")
  tokenPrice5m: [TokenPrice5m!]! @derivedFrom(field: "token")
}

type LiquidityPair @entity{
  id: ID!
  token0: Bytes!
  token1: Bytes!
  reserve0: BigInt!
  reserve1: BigInt!
  swaps: [Swap!]! @derivedFrom(field: "pair")
}

type Swap @entity(immutable: true){
  id: ID!
  pair: LiquidityPair!
  amount: BigInt!
  price: BigDecimal!
  type: String!
  user: Bytes!
  transactionHash: Bytes!
  blockTimestamp: BigInt!
  token: Token!
}

type BaseToken @entity {
  id: ID!
  address: Bytes!
  name: String!
  symbol: String!
  decimals: Int!
  price: BigDecimal!
  imageUrl: String!
}

type Token24hData @entity {
    id: ID!
    date: Int!
    token: Token!
    buys24h: BigInt!
    sells24h: BigInt!
    buyVolumeUsd24h: BigDecimal!
    sellVolumeUsd24h: BigDecimal!
    sellers24h: [Bytes!]
    buyers24h: [Bytes!]
    price: BigDecimal!
}

type TokenPrice6h @entity {
    id: ID!
    date: Int!
    token: Token!
    price: BigDecimal!
}

type TokenPriceHour @entity {
    id: ID!
    date: Int!
    token: Token!
    price: BigDecimal!
}

type TokenPrice5m @entity {
    id: ID!
    date: Int!
    token: Token!
    price: BigDecimal!
}