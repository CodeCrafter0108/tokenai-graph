specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Launchpad
    network: sonic
    source:
      address: "0x333fE6dDA12D69bE0C7dB670785206E4419721E4"
      abi: Launchpad
      startBlock: 15878138
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Listing
      abis:
        - name: Launchpad
          file: ./abis/Launchpad.json
        - name: ERC20Token
          file: ./abis/erc20.json
        - name: UniswapV2Pair
          file: ./abis/v2-pair.json
        - name: UniswapV2Factory
          file: ./abis/v2-factory.json
        - name: UniswapV3Pair
          file: ./abis/v3-pair.json
        - name: UniswapV3Factory
          file: ./abis/v3-factory.json
        - name: NativeTokenPriceOracle
          file: ./abis/native-price-oracle.json
      eventHandlers:
        - event: Listing(indexed address,address,string,string,string,string,string,string,string)
          handler: handleListing
      file: ./src/handlers/launchpad.ts
      
  - kind: ethereum
    name: PriceOracle
    network: sonic
    source:
      address: "0xc76dFb89fF298145b417d221B2c747d84952e01d"
      abi: PriceOracle
      startBlock: 16535899
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - BaseToken
      abis:
        - name: PriceOracle
          file: ./abis/native-price-oracle.json
      blockHandlers:
        - handler: handleBlock
          filter:
            kind: call 
            every: 750
      file: ./src/handlers/oracle.ts

templates:
  - kind: ethereum/contract
    name: LiquidityPairListener
    network: sonic
    source:
      abi: UniswapV2PairListener
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/handlers/swaps.ts
      entities:
        - Swap
      abis:
        - name: UniswapV2PairListener
          file: ./abis/v2-pair.json
        - name: Launchpad
          file: ./abis/Launchpad.json
        - name: ERC20Token
          file: ./abis/erc20.json
        - name: UniswapV2Pair
          file: ./abis/v2-pair.json
        - name: UniswapV2Factory
          file: ./abis/v2-factory.json
        - name: UniswapV3Pair
          file: ./abis/v3-pair.json
        - name: UniswapV3Factory
          file: ./abis/v3-factory.json
        - name: NativeTokenPriceOracle
          file: ./abis/native-price-oracle.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,indexed address)
          handler: handleSwap
